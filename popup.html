<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>بار انداز</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <header class="brand">
      <span class="brand__logo" aria-hidden="true">
        <img src="icons/mark.png" alt="">
      </span>
      <span class="brand__text">
        <strong class="brand__name">بار انداز</strong>
        <span class="brand__tag">دانلود مستقیم APK از کافه‌بازار و مایکت</span>
      </span>
    </header>

    <section class="panel">
      <div class="field">
        <span class="field__label">فروشگاه</span>
        <div class="switch" id="storeRow" role="tablist" aria-label="فروشگاه">
          <button type="button" class="switch__item" data-store="cafebazaar" role="tab">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            کافه‌بازار
          </button>
          <button type="button" class="switch__item" data-store="myket" role="tab">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            مایکت
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="pkg">نام پکیج یا لینک صفحهٔ اپ</label>
        <div class="input">
          <svg class="i input__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input id="pkg" type="text" dir="ltr" placeholder="com.example.app" autocomplete="off" spellcheck="false">
          <button type="button" class="input__clear" id="clear" title="پاک کردن" aria-label="پاک کردن" hidden>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <button class="btn btn--primary" id="go">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          دریافت لینک
        </button>
        <button class="btn btn--ghost btn--square" id="fromTab" title="خواندن پکیج و فروشگاه از تب فعلی" aria-label="خواندن از تب فعلی">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M12 3v4"/><path d="M8 21h8"/></svg>
        </button>
      </div>
    </section>

    <div id="msg" class="alert" hidden></div>

    <section id="card" class="result" hidden>
      <div class="result__head">
        <img id="icon" class="result__icon" alt="" hidden>
        <span class="result__ident">
          <strong id="appName" class="result__name"></strong>
          <span id="chips" class="chips"></span>
        </span>
        <span id="badge" class="badge" hidden>رایگان</span>
      </div>

      <div class="linkrow">
        <input id="url" type="text" dir="ltr" readonly>
        <button class="btn btn--ghost btn--square" id="copy" title="کپی لینک" aria-label="کپی لینک">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>

      <div class="row">
        <button class="btn btn--cta" id="dl">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="M7 10l5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
          دانلود APK
        </button>
        <a class="btn btn--ghost btn--square" id="open" target="_blank" rel="noopener" title="باز کردن لینک در تب جدید" aria-label="باز کردن لینک">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </a>
      </div>
    </section>

    <footer class="foot">
      <a href="https://leepaak.ir" target="_blank" rel="noopener">لیپک</a>
      <span class="dot">•</span>
      <span>فقط اپ‌های رایگان</span>
      <span class="dot">•</span>
      <span>لینک‌ها موقتی‌اند</span>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
