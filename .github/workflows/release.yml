name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the tag matches the manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./manifest.json').version")"
          echo "tag=$tag manifest=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match manifest version $version"
            exit 1
          fi

      - name: Run check.js
        run: node tools/check.js

      - name: Build the release package
        run: node tools/build.js

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: بار انداز ${{ github.ref_name }}
          files: dist/*.zip
          # عمداً generate_release_notes استفاده نمی‌شود: وقتی true باشد،
          # GitHub بدنهٔ body را نادیده می‌گیرد و توضیح فارسی از بین می‌رود.
          body: |
            **بار انداز** — لینک دانلود مستقیم APK برای اپ‌های رایگان کافه‌بازار و مایکت.

            ### نصب

            بستهٔ نصبی این نسخه، فایل زیپ زیر است:

            ۱. زیپ را دانلود و باز کن.
            ۲. در کروم به `chrome://extensions` برو.
            ۳. **Developer mode** را روشن کن.
            ۴. **Load unpacked** را بزن و پوشهٔ بازشده را انتخاب کن.

            ### تغییرات

            فهرست کامل: [CHANGELOG.md](https://github.com/mmehdishafiee/bar-andaz/blob/main/CHANGELOG.md)

            پروانه: [MIT](https://github.com/mmehdishafiee/bar-andaz/blob/main/LICENSE) · سازگار با Chrome 102+
